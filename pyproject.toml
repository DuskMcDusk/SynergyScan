[project]
name = "synergyscan"
version = "0.1.0"
description = "Small-business inventory tracking with barcode scanning and Supvan T50M Pro label printing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pillow>=10.4",
    "hidapi>=0.14",
    "python-barcode>=0.15",
    "qrcode>=7.4",
]

# NOTE: selfupdate/ deliberately uses only the standard library (urllib, zipfile,
# hashlib, subprocess). It is the one component that cannot be repaired by
# shipping an update, so it must not depend on anything that could fail to
# install. Do not add third-party imports under src/synergyscan/selfupdate/.

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.7"]

[project.scripts]
synergyscan = "synergyscan.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synergyscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["hardware: requires a physical T50M Pro connected over USB"]

[tool.ruff]
line-length = 100
target-version = "py312"
